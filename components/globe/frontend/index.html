<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbix Globe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Star field and vignette live behind the WebGL canvas, which renders
         with a transparent clear colour. -->
    <div id="starfield" aria-hidden="true"></div>
    <div id="stage">
      <div id="globe"></div>
    </div>

    <header id="hud-title">
      <span class="wordmark">MISSION VIEW</span>
      <span class="hud-sep">//</span>
      <span class="hud-sub">Earth-fixed</span>
    </header>

    <div id="hud-legend">
      <span class="legend-item"><i class="dot sat"></i>Satellite (true altitude)</span>
      <span class="legend-item"><i class="dot track"></i>Orbit track &middot; 1 period</span>
    </div>

    <div id="hud-attribution">
      Earth imagery: NASA Blue Marble (public domain) &middot; Globe.gl / Three.js
    </div>

    <div id="status" class="status">
      <div class="status-card">
        <div class="spinner"></div>
        <p id="status-text">Initialising 3D engine&hellip;</p>
      </div>
    </div>

    <script src="./vendor/globe.gl.min.js"></script>
    <script src="./orbix-globe.js"></script>
  </body>
</html>
