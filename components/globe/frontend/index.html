<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbix Globe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Star field and vignette sit behind the transparent WebGL canvas. -->
    <div id="starfield" aria-hidden="true"></div>
    <div id="stage">
      <div id="globe"></div>
    </div>

    <header id="hud-title">
      <span class="wordmark">MISSION VIEW</span>
      <span class="hud-sep">//</span>
      <span class="hud-sub">Earth-fixed</span>
    </header>

    <!-- Constellation filter (local: no data is re-requested) -->
    <section id="panel-groups" class="hud-panel">
      <div class="hud-heading">Constellations</div>
      <div id="filters"></div>
      <div class="hud-metric">
        <span><b id="visible-count">0</b> / <span id="total-count">0</span> visible</span>
        <span class="dim" id="fps-count">&mdash;</span>
      </div>
    </section>

    <!-- Selection readout -->
    <section id="panel-selection" class="hud-panel">
      <div class="hud-heading">Selected</div>
      <div id="selected-name">click a satellite</div>
      <div id="selected-meta" class="dim">hover to identify &middot; click to select</div>
    </section>

    <!-- Simulation playback (runs entirely in the browser) -->
    <section id="panel-playback" class="hud-panel">
      <div class="playback-row">
        <button id="play-button" type="button">&#9654; Play</button>
        <button id="reset-button" type="button">&#8635; Reset</button>
        <select id="speed-select" title="simulation speed">
          <option value="10">10&times;</option>
          <option value="30">30&times;</option>
          <option value="60" selected>60&times;</option>
          <option value="300">300&times;</option>
          <option value="900">900&times;</option>
        </select>
        <input id="time-slider" type="range" min="0" max="1" step="0.001"
               value="0" title="simulation time" />
        <span id="sim-clock" class="mono">&mdash;</span>
      </div>
      <div class="playback-meta">
        <span id="window-range"></span>
        <span id="window-note" class="dim"></span>
      </div>
    </section>

    <div id="tooltip"></div>
    <div id="selection-marker" hidden aria-hidden="true"><i></i><span></span></div>

    <div id="hud-attribution">
      Earth imagery: NASA Blue Marble (public domain) &middot; SGP4 / Skyfield &middot; CelesTrak
    </div>

    <div id="status" class="status">
      <div class="status-card">
        <div class="spinner"></div>
        <p id="status-text">Initialising 3D engine&hellip;</p>
      </div>
    </div>

    <script src="./vendor/globe.gl.min.js"></script>
    <script type="module" src="./orbix-globe.js"></script>
  </body>
</html>
